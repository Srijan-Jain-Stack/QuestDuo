<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuestDuo - Mood Hero</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:#17152e;color:#fff;font-family:system-ui,sans-serif}
main{max-width:900px;margin:auto}
h1{text-align:center;color:#fbbf24;margin:10px 0 4px}
.sub{text-align:center;color:#c4b5fd;margin:0 0 20px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:#25213d;border:2px solid #a78bfa;border-radius:18px;padding:18px;text-align:center}
video{width:100%;border-radius:12px;background:#000;transform:scaleX(-1)}
canvas#hero{width:256px;height:384px;max-width:100%;image-rendering:pixelated}
button,a.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;margin:6px 3px;background:#a78bfa;color:#17152e;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:not-allowed}
.mood-btns button{background:#3b3560;color:#fff;padding:8px 10px;font-size:13px}
#status{min-height:22px;color:#a9f5c6;margin:8px 0}
#moodText{font-size:20px;font-weight:800;color:#fbbf24;margin:4px 0}
@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>QuestDuo 🎮</h1>
<p class="sub">Take a photo. Your mood becomes your hero.</p>
<div class="layout">
  <section class="panel">
    <video id="cam" autoplay playsinline muted></video>
    <div>
      <button id="start">📷 Open Camera</button>
      <button id="snap" disabled>📸 Take Photo</button>
    </div>
    <div id="status">Loading mood detector...</div>
    <div class="mood-btns">
      <div style="color:#c4b5fd;font-size:12px">Or pick a mood yourself:</div>
      <button data-m="happy">😄 Happy</button>
      <button data-m="sad">😢 Sad</button>
      <button data-m="angry">😠 Angry</button>
      <button data-m="surprised">😲 Surprised</button>
      <button data-m="neutral">😐 Calm</button>
    </div>
  </section>
  <section class="panel">
    <canvas id="hero" width="64" height="96"></canvas>
    <div id="moodText">Take a photo to begin</div>
    <a class="btn" id="download" download="questduo-hero.png" href="#">⬇ Download PNG</a>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
const cam = document.getElementById('cam');
const startBtn = document.getElementById('start');
const snapBtn = document.getElementById('snap');
const statusEl = document.getElementById('status');
const moodText = document.getElementById('moodText');
const canvas = document.getElementById('hero');
const ctx = canvas.getContext('2d');
let stream = null;
let modelsReady = false;

// Each mood = a different hero class + colors
const HEROES = {
  happy:     {name:'SUNNY KNIGHT',   cls:'knight', hair:'#7a4a21', skin:'#f0b78f', armor:'#e8b923', dark:'#a8741a', accent:'#fff1a8', weapon:'#e5eef7'},
  sad:       {name:'RAIN MAGE',      cls:'mage',   hair:'#2f3f6b', skin:'#e8b08c', armor:'#4a6fb5', dark:'#26335f', accent:'#8fd3ff', weapon:'#b7e4ff'},
  angry:     {name:'FIRE WARRIOR',   cls:'axe',    hair:'#2a1a1a', skin:'#e0a07c', armor:'#c0392b', dark:'#6d1d17', accent:'#ffb347', weapon:'#d9dde3'},
  surprised: {name:'STORM RANGER',   cls:'ranger', hair:'#5a2b6b', skin:'#f0b78f', armor:'#2fb5a8', dark:'#1a5a63', accent:'#f9f871', weapon:'#e5dfc8'},
  neutral:   {name:'SHADOW ROGUE',   cls:'rogue',  hair:'#2a2638', skin:'#dca17c', armor:'#6c5a86', dark:'#2c2540', accent:'#e76f8c', weapon:'#d8e1ed'}
};

function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}

function drawFace(mood,p){
  R(24,13,17,15,p.skin);
  R(22,17,3,8,p.skin);
  R(40,17,3,8,p.skin);
  const ink='#292034', mouth='#8b3e55';
  if(mood==='happy'){
    R(27,19,4,1,ink); R(28,18,2,1,ink);
    R(35,19,4,1,ink); R(36,18,2,1,ink);
    R(29,23,8,1,mouth); R(28,22,1,1,mouth); R(37,22,1,1,mouth);
    R(29,24,8,1,'#fff'); 
    R(25,21,3,2,'#ff9aa2'); R(38,21,3,2,'#ff9aa2');
  } else if(mood==='sad'){
    R(27,18,4,3,ink); R(35,18,4,3,ink);
    R(28,18,1,1,'#fff'); R(36,18,1,1,'#fff');
    R(28,21,1,3,'#6cc8ff'); R(37,21,1,3,'#6cc8ff');
    R(30,24,6,1,mouth); R(29,25,1,1,mouth); R(36,25,1,1,mouth);
    R(26,15,4,1,ink); R(36,15,4,1,ink); R(25,16,2,1,ink); R(39,16,2,1,ink);
  } else if(mood==='angry'){
    R(26,16,4,1,ink); R(29,17,2,1,ink);
    R(36,16,4,1,ink); R(35,17,2,1,ink);
    R(27,19,4,2,ink); R(35,19,4,2,ink);
    R(29,24,8,1,mouth); R(30,25,6,1,mouth);
    R(29,23,1,1,'#fff'); R(36,23,1,1,'#fff');
  } else if(mood==='surprised'){
    R(26,17,5,5,'#fff'); R(35,17,5,5,'#fff');
    R(28,19,2,2,ink); R(37,19,2,2,ink);
    R(26,14,5,1,ink); R(35,14,5,1,ink);
    R(31,23,4,4,'#5a2035'); R(32,24,2,2,'#ff7f9a');
  } else {
    R(27,18,4,2,ink); R(35,18,4,2,ink);
    R(28,18,1,1,'#fff'); R(36,18,1,1,'#fff');
    R(30,24,6,1,mouth);
  }
  R(32,20,2,2,'#c98767'); // nose
}

function drawHero(mood){
  const p = HEROES[mood];
  ctx.clearRect(0,0,64,96);
  // shadow
  R(15,89,34,3,'#0c0b18'); R(19,87,26,2,'#161329');
  // cape
  R(20,31,24,31,p.dark); R(17,36,5,19,p.dark); R(42,36,5,19,p.dark);
  // legs + boots
  R(23,59,8,19,p.armor); R(34,59,8,19,p.armor);
  R(22,75,10,8,p.dark); R(33,75,10,8,p.dark);
  R(18,81,14,7,'#34243a'); R(32,81,15,7,'#34243a');
  R(18,81,12,2,p.accent); R(34,81,12,2,p.accent);
  // arms
  R(16,34,7,20,p.armor); R(41,34,7,20,p.armor);
  R(17,50,7,8,p.skin); R(41,50,7,8,p.skin);
  R(17,56,7,4,p.dark); R(41,56,7,4,p.dark);
  // torso
  R(23,30,19,30,p.armor); R(20,34,4,20,p.armor); R(42,34,4,20,p.armor);
  R(28,31,8,23,p.dark); R(29,34,6,15,p.accent);
  R(26,51,14,5,p.dark); R(29,52,7,3,p.accent);
  R(30,39,4,4,p.accent); R(31,40,2,2,'#fff0ad');
  // neck
  R(28,25,9,8,p.skin);
  // hair
  R(22,10,21,18,p.hair); R(20,15,4,13,p.hair); R(41,14,4,13,p.hair);
  // face (drawn by mood)
  drawFace(mood,p);
  R(25,10,15,5,p.hair); R(23,12,5,6,p.hair); R(36,12,5,4,p.hair);
  // headgear + weapon by class
  if(p.cls==='knight'){
    R(23,10,19,4,p.armor); R(27,7,11,4,p.accent); R(30,8,5,2,p.armor);
    R(48,38,3,26,p.weapon); R(46,40,7,3,p.accent); R(48,64,3,6,p.accent);
  } else if(p.cls==='mage'){
    R(24,8,17,4,p.accent); R(27,3,12,6,p.armor); R(30,0,6,5,p.accent);
    R(49,29,3,48,'#80562f'); R(47,24,7,7,p.accent); R(48,25,5,5,'#f4ffff');
  } else if(p.cls==='axe'){
    R(21,10,23,4,p.dark); R(19,6,5,8,p.weapon); R(41,6,5,8,p.weapon);
    R(49,30,3,46,'#6b4423'); R(44,30,10,9,p.weapon); R(43,32,2,5,p.accent);
  } else if(p.cls==='ranger'){
    R(20,10,25,4,p.dark); R(24,7,17,4,p.armor); R(20,13,5,3,p.accent);
    R(49,31,2,8,p.accent); R(51,38,2,18,p.accent); R(49,55,2,8,p.accent); R(48,34,2,25,p.weapon);
  } else {
    R(23,10,19,4,p.dark); R(24,7,17,4,p.hair); R(21,14,4,9,p.dark);
    R(14,42,3,14,p.weapon); R(13,39,5,4,p.accent);
    R(47,42,3,14,p.weapon); R(46,39,5,4,p.accent);
  }
  moodText.textContent = p.name;
}

function pickMood(expr){
  // fearful -> surprised, disgusted -> angry
  const map = {happy:'happy', sad:'sad', angry:'angry', surprised:'surprised',
               fearful:'surprised', disgusted:'angry', neutral:'neutral'};
  let best='neutral', top=-1;
  for(const k in expr){ if(expr[k]>top){top=expr[k];best=k;} }
  return {mood:map[best]||'neutral', label:best, score:top};
}

async function loadModels(){
  try{
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
    modelsReady = true;
    statusEl.textContent = 'Ready! Open the camera.';
  }catch(e){
    statusEl.textContent = 'Mood detector could not load (need internet). Use the mood buttons below.';
  }
}

function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  snapBtn.disabled = true;
  startBtn.textContent = '📷 Open Camera';
}

startBtn.addEventListener('click', async ()=>{
  if(stream){stopCam();return;}
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    cam.srcObject = stream;
    snapBtn.disabled = false;
    startBtn.textContent = '✖ Close Camera';
    statusEl.textContent = 'Make a face (smile, frown, shock...) and click Take Photo!';
  }catch(err){
    statusEl.textContent = 'Camera error: ' + err.name + '. Allow camera permission.';
  }
});

snapBtn.addEventListener('click', async ()=>{
  if(!stream || !cam.videoWidth){statusEl.textContent='Camera not ready yet.';return;}
  const snap = document.createElement('canvas');
  snap.width = cam.videoWidth; snap.height = cam.videoHeight;
  snap.getContext('2d').drawImage(cam,0,0);
  if(!modelsReady){
    statusEl.textContent = 'Detector not loaded. Use the mood buttons.';
    return;
  }
  statusEl.textContent = 'Reading your expression...';
  try{
    const det = await faceapi.detectSingleFace(snap, new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.3})).withFaceExpressions();
    if(!det){
      statusEl.textContent = 'No face found. Come closer, add light, and try again.';
      return;
    }
    const r = pickMood(det.expressions);
    drawHero(r.mood);
    statusEl.textContent = 'You look ' + r.label + ' (' + Math.round(r.score*100) + '%) 🎉';
    stopCam();
  }catch(e){
    statusEl.textContent = 'Could not read the photo. Try again.';
  }
});

document.querySelectorAll('[data-m]').forEach(b=>{
  b.addEventListener('click',()=>{drawHero(b.dataset.m);statusEl.textContent='Mood picked: '+b.dataset.m;});
});

document.getElementById('download').addEventListener('click',e=>{
  const big=document.createElement('canvas');
  big.width=256;big.height=384;
  const c=big.getContext('2d');
  c.imageSmoothingEnabled=false;
  c.drawImage(canvas,0,0,256,384);
  e.currentTarget.href=big.toDataURL('image/png');
});

drawHero('neutral');
moodText.textContent = 'Take a photo to begin';
loadModels();
</script>
</body>
</html>
